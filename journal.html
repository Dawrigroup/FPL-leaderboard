<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مجلة الجولة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg1: #eeecf7;
    --bg2: #e2ddf4;
    --ink: #241a3d;
    --purple-deep: #2c1a4d;
    --purple: #6d3fd6;
    --cyan: #17c9e0;
    --card: #ffffff;
    --muted: #7a7392;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Cairo', sans-serif;
    color: var(--ink);
    background: #d9d4ec;
    padding: 20px 12px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  a.back-link {
    align-self: flex-start;
    max-width: 390px;
    width: 100%;
    margin: 0 auto 10px;
    font-size: 12px;
    font-weight: 800;
    color: var(--purple);
    text-decoration: none;
  }

  .actions { display: flex; gap: 8px; margin-bottom: 14px; }
  .actions button {
    font-family: 'Cairo', sans-serif;
    font-weight: 800;
    font-size: 12.5px;
    border: none;
    border-radius: 999px;
    padding: 9px 16px;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(135deg, var(--purple), var(--cyan));
    box-shadow: 0 4px 12px rgba(44,26,77,0.25);
  }
  .actions button:active { transform: scale(0.97); }

  .sheet {
    width: 390px;
    background:
      radial-gradient(circle at 12% 6%, rgba(109,63,214,0.10), transparent 40%),
      radial-gradient(circle at 90% 14%, rgba(23,201,224,0.14), transparent 45%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    border-radius: 18px;
    padding: 16px 16px 14px;
    box-shadow: 0 10px 30px rgba(44,26,77,0.2);
  }

  .masthead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .masthead .kicker {
    background: #fff;
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 9.5px;
    font-weight: 800;
    color: var(--purple);
    box-shadow: 0 0 0 1.5px rgba(109,63,214,0.35) inset;
    white-space: nowrap;
  }
  .masthead h1 { font-weight: 900; font-size: 19px; margin: 0; color: var(--purple-deep); text-align: center; }
  .masthead .ball { font-size: 15px; }

  .recap-hero {
    background: linear-gradient(145deg, var(--purple-deep), #3a2266);
    border-radius: 13px;
    padding: 12px 14px;
    margin-bottom: 9px;
    text-align: center;
  }
  .recap-hero .rlbl { color: #cfc3ee; font-size: 9.5px; font-weight: 700; }
  .recap-hero .rtitle { color: #fff; font-size: 14.5px; font-weight: 900; margin: 3px 0 7px; line-height: 1.35; }
  .recap-hero .rtag {
    display: inline-block;
    background: rgba(23,201,224,0.18);
    border: 1px solid rgba(23,201,224,0.5);
    color: #b6f3fa;
    font-size: 10px;
    font-weight: 700;
    padding: 4px 11px;
    border-radius: 999px;
  }

  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 9px; }
  .stat-card { background: var(--card); border-radius: 10px; padding: 7px 4px; text-align: center; border: 1.5px solid rgba(109,63,214,0.18); }
  .stat-card .sval { font-size: 14px; font-weight: 900; color: var(--purple-deep); }
  .stat-card .slbl { font-size: 8px; color: var(--muted); font-weight: 700; margin-top: 1px; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 9px; }
  .panel { background: var(--card); border-radius: 12px; border: 1.5px solid rgba(109,63,214,0.18); padding: 8px 9px; }
  .panel-title { font-weight: 800; font-size: 10px; color: var(--purple-deep); margin-bottom: 6px; text-align: center; }

  .mini-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px solid rgba(109,63,214,0.08); }
  .mini-row:last-child { border-bottom: none; }
  .mini-badge {
    width: 16px; height: 16px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 8px; color: #fff;
    background: linear-gradient(135deg, var(--cyan), #4fe0f0);
    flex-shrink: 0;
  }
  .mini-badge.rest { background: linear-gradient(135deg, var(--purple-deep), #4a2d80); }
  .mini-name { flex: 1; font-weight: 800; font-size: 9.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini-pts { font-weight: 900; font-size: 10px; color: var(--purple-deep); flex-shrink: 0; }

  .cap-mini { padding: 4px 0; border-bottom: 1px solid rgba(109,63,214,0.08); }
  .cap-mini:last-child { border-bottom: none; }
  .cap-mini .cm-top { display: flex; justify-content: space-between; align-items: center; }
  .cap-mini .cm-who { font-weight: 800; font-size: 9.5px; }
  .cap-mini .cm-val { font-weight: 900; font-size: 11px; color: var(--cyan); }
  .cap-mini .cm-what { font-size: 8px; color: var(--muted); font-weight: 600; margin-top: 1px; }

  .derby-box {
    background: linear-gradient(135deg, var(--purple-deep), #3a2266);
    border-radius: 12px;
    padding: 9px 12px;
    margin-bottom: 9px;
    text-align: center;
  }
  .derby-box .dlbl { color: #cfc3ee; font-size: 9px; font-weight: 700; margin-bottom: 6px; }
  .derby-row { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .derby-team { color: #fff; font-weight: 800; font-size: 10px; flex: 1; text-align: center; }
  .derby-score { color: #fff; font-weight: 900; font-size: 13px; }
  .derby-vs { background: var(--cyan); color: var(--purple-deep); font-weight: 900; font-size: 8.5px; padding: 3px 7px; border-radius: 999px; }
  .derby-diff { color: #b6f3fa; font-size: 8.5px; font-weight: 700; margin-top: 5px; }

  .standings-panel { margin-bottom: 6px; }

  footer { text-align: center; font-size: 8px; color: var(--muted); font-weight: 600; padding-top: 2px; }

  .msg { text-align: center; padding: 40px 16px; color: var(--muted); font-size: 13px; font-weight: 700; }
</style>
</head>
<body>

<a class="back-link" href="index.html">→ رجوع للوحة الرئيسية</a>

<div class="actions">
  <button id="btn-img">تحميل صورة</button>
  <button id="btn-pdf">تحميل PDF</button>
</div>

<div class="sheet" id="sheet">
  <div id="journal-content">
    <div class="msg">جاري تحميل بيانات الجولة…</div>
  </div>
</div>

<script>
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  function renderJournal(data) {
    const s = data.gw_summary;
    const container = document.getElementById('journal-content');

    if (!s) {
      container.innerHTML = '<div class="msg">لا يوجد ملخص متاح لهذه الجولة بعد.</div>';
      return;
    }

    const leader = s.top_scorers?.[0];
    const heroTitle = leader
      ? `${escapeHtml(leader.team_name)} يتصدر الجولة ${s.gw} بـ${leader.points} نقطة`
      : `ملخص الجولة ${s.gw}`;

    const top3Html = (s.top_scorers || []).map((p, i) => `
      <div class="mini-row">
        <div class="mini-badge">${i + 1}</div>
        <div class="mini-name">${escapeHtml(p.team_name)}</div>
        <div class="mini-pts">${p.points}</div>
      </div>
    `).join('') || '<div class="msg" style="padding:10px;font-size:11px;">لا توجد بيانات</div>';

    let capHtml = '';
    if (s.bench_king) {
      capHtml += `
        <div class="cap-mini">
          <div class="cm-top"><span class="cm-who">${escapeHtml(s.bench_king.team_name)}</span><span class="cm-val">${s.bench_king.bench_points}</span></div>
          <div class="cm-what">👑 ملك الدكة</div>
        </div>`;
    }
    if (s.worst_captain) {
      capHtml += `
        <div class="cap-mini">
          <div class="cm-top"><span class="cm-who">${escapeHtml(s.worst_captain.team_name)}</span><span class="cm-val">${s.worst_captain.captain_points}</span></div>
          <div class="cm-what">📉 كبتنة ضائعة — ${escapeHtml(s.worst_captain.captain_name)}</div>
        </div>`;
    }
    if (s.best_differential_captain) {
      capHtml += `
        <div class="cap-mini">
          <div class="cm-top"><span class="cm-who">${escapeHtml(s.best_differential_captain.team_name)}</span><span class="cm-val">${s.best_differential_captain.captain_points}</span></div>
          <div class="cm-what">🐺 الذئب المنفرد — ${escapeHtml(s.best_differential_captain.captain_name)}</div>
        </div>`;
    }
    if (!capHtml) capHtml = '<div class="msg" style="padding:10px;font-size:11px;">لا توجد بيانات</div>';

    let derbyHtml = '';
    if (s.derby) {
      derbyHtml = `
        <div class="derby-box">
          <div class="dlbl">⚔️ ديربي الجولة</div>
          <div class="derby-row">
            <div class="derby-team">${escapeHtml(s.derby.team_a)}<br><span class="derby-score">${s.derby.score_a}</span></div>
            <div class="derby-vs">VS</div>
            <div class="derby-team">${escapeHtml(s.derby.team_b)}<br><span class="derby-score">${s.derby.score_b}</span></div>
          </div>
          <div class="derby-diff">فرق ${s.derby.diff} نقطة فقط بينهم</div>
        </div>
      `;
    }

    const topStandings = [...(data.players || [])]
      .sort((a, b) => (a.rank ?? 999) - (b.rank ?? 999))
      .slice(0, 4);

    const standingsHtml = topStandings.map(p => `
      <div class="mini-row">
        <div class="mini-badge ${p.rank > 3 ? 'rest' : ''}">${p.rank}</div>
        <div class="mini-name">${escapeHtml(p.team_name)}</div>
        <div class="mini-pts">${p.total_points ?? '–'}</div>
      </div>
    `).join('');

    container.innerHTML = `
      <div class="masthead">
        <span class="kicker">الجولة ${s.gw}</span>
        <h1><span class="ball">⚽</span> مجلة الجولة</h1>
        <span class="kicker">${escapeHtml(data.league_name || '')}</span>
      </div>

      <div class="recap-hero">
        <div class="rlbl">ملخص الجولة</div>
        <div class="rtitle">${heroTitle}</div>
        <div class="rtag">🔥 ${leader ? escapeHtml(leader.team_name) + ' — ' + leader.points + ' نقطة' : ''}</div>
      </div>

      <div class="stat-grid">
        <div class="stat-card"><div class="sval">${s.average_score ?? '–'}</div><div class="slbl">متوسط الجولة</div></div>
        <div class="stat-card"><div class="sval">${s.highest_score ?? '–'}</div><div class="slbl">أعلى رصيد</div></div>
        <div class="stat-card"><div class="sval">${s.lowest_score ?? '–'}</div><div class="slbl">أقل رصيد</div></div>
      </div>

      <div class="two-col">
        <div class="panel">
          <div class="panel-title">أعلى ٣ بالجولة</div>
          ${top3Html}
        </div>
        <div class="panel">
          <div class="panel-title">🎖️ الكباتن</div>
          ${capHtml}
        </div>
      </div>

      ${derbyHtml}

      <div class="two-col standings-panel" style="grid-template-columns: 1fr;">
        <div class="panel">
          <div class="panel-title">الترتيب العام</div>
          ${standingsHtml}
        </div>
      </div>

      <footer>صدر عن ${escapeHtml(data.league_name || '')} · fantasy.premierleague.com</footer>
    `;
  }

  async function loadData() {
    try {
      const res = await fetch('data.json?_=' + Date.now());
      if (!res.ok) throw new Error('no data yet');
      const data = await res.json();
      renderJournal(data);
    } catch (e) {
      document.getElementById('journal-content').innerHTML =
        '<div class="msg">تعذر تحميل البيانات — تأكد أن data.json موجود.</div>';
    }
  }

  function captureSheet(callback) {
    html2canvas(document.getElementById('sheet'), {
      scale: 3,
      backgroundColor: '#eeecf7',
      useCORS: true
    }).then(callback);
  }

  document.getElementById('btn-img').addEventListener('click', () => {
    captureSheet((canvas) => {
      canvas.toBlob(async (blob) => {
        if (!blob) return;
        const file = new File([blob], 'gw-journal.png', { type: 'image/png' });

        // iOS Safari ignores the download attribute for images, so use the
        // native share sheet when available — this also lets people share
        // straight to WhatsApp in one tap.
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: 'مجلة الجولة' });
            return;
          } catch (e) {
            // user cancelled the share sheet — fall through to download
          }
        }

        // Desktop / Android fallback: normal download link
        const link = document.createElement('a');
        link.download = 'gw-journal.png';
        link.href = URL.createObjectURL(blob);
        link.click();
        URL.revokeObjectURL(link.href);
      }, 'image/png');
    });
  });

  document.getElementById('btn-pdf').addEventListener('click', () => {
    captureSheet((canvas) => {
      const { jsPDF } = window.jspdf;
      const imgData = canvas.toDataURL('image/png');
      const pdfWidth = 210;
      const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
      const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: [pdfWidth, pdfHeight] });
      pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
      pdf.save('gw-journal.pdf');
    });
  });

  loadData();
</script>

</body>
</html>
