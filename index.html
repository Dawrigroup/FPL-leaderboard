<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pitch: #0e3b2c;
    --pitch-deep: #08281d;
    --line: #f2ede1;
    --chalk: #f2ede1;
    --chalk-dim: #b9c9bf;
    --gold: #d4af37;
    --silver: #c7ccd1;
    --bronze: #b8794f;
    --up: #4caf6e;
    --down: #d4665a;
    --flat: #7d8f86;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      repeating-linear-gradient(
        90deg,
        var(--pitch) 0px,
        var(--pitch) 64px,
        var(--pitch-deep) 64px,
        var(--pitch-deep) 128px
      );
    font-family: 'Inter', sans-serif;
    color: var(--chalk);
    padding: 32px 16px 80px;
  }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  .eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(32px, 7vw, 52px);
    line-height: 1;
    margin: 0 0 14px;
    letter-spacing: -0.01em;
    text-shadow: 0 2px 0 rgba(0,0,0,0.25);
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--chalk-dim);
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(242,237,225,0.15);
    padding: 6px 14px;
    border-radius: 999px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--up);
    box-shadow: 0 0 0 0 rgba(76,175,110,0.6);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(76,175,110,0.55); }
    70% { box-shadow: 0 0 0 7px rgba(76,175,110,0); }
    100% { box-shadow: 0 0 0 0 rgba(76,175,110,0); }
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: rgba(8,40,29,0.55);
    border: 1px solid rgba(242,237,225,0.14);
    border-radius: 10px;
    overflow: hidden;
    backdrop-filter: blur(2px);
  }

  thead th {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    text-align: left;
    padding: 14px 16px;
    border-bottom: 1px solid rgba(242,237,225,0.18);
  }

  th.num, td.num { text-align: right; }
  th.mv, td.mv { text-align: center; width: 40px; }

  tbody tr {
    border-bottom: 1px solid rgba(242,237,225,0.08);
    transition: background 0.15s ease;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(242,237,225,0.05); }

  td { padding: 13px 16px; font-size: 14.5px; }

  .rank {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 15px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 6px;
  }
  .rank-1 { background: var(--gold); color: #1a1a1a; }
  .rank-2 { background: var(--silver); color: #1a1a1a; }
  .rank-3 { background: var(--bronze); color: #1a1a1a; }

  .team { font-weight: 700; color: var(--line); }
  .manager { display: block; font-size: 12px; color: var(--chalk-dim); margin-top: 1px; }

  .pts-total { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 15px; }
  .pts-gw { font-family: 'Space Mono', monospace; color: var(--chalk-dim); font-size: 13px; }

  .mv-up { color: var(--up); }
  .mv-down { color: var(--down); }
  .mv-flat { color: var(--flat); }

  footer {
    text-align: center;
    margin-top: 22px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--chalk-dim);
    letter-spacing: 0.04em;
  }

  .msg {
    text-align: center;
    padding: 48px 16px;
    color: var(--chalk-dim);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
  }

  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Classic League</div>
      <h1 id="league-name">Loading…</h1>
      <div class="status"><span class="dot"></span><span id="updated-text">checking…</span></div>
    </header>

    <table id="board" style="display:none">
      <thead>
        <tr>
          <th>#</th>
          <th class="mv"></th>
          <th>Team</th>
          <th class="num">GW</th>
          <th class="num">Total</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <div class="msg" id="loading-msg">Fetching standings…</div>

    <footer>Data refreshes automatically · source: fantasy.premierleague.com</footer>
  </div>

<script>
  const REFRESH_MS = 60 * 1000; // client re-checks every 60s; underlying data.json updates ~every 15 min

  function movementArrow(rank, lastRank) {
    if (!lastRank || lastRank === rank) return '<span class="mv-flat">–</span>';
    if (lastRank > rank) return '<span class="mv-up">▲</span>';
    return '<span class="mv-down">▼</span>';
  }

  function rankBadgeClass(rank) {
    if (rank === 1) return 'rank rank-1';
    if (rank === 2) return 'rank rank-2';
    if (rank === 3) return 'rank rank-3';
    return 'rank';
  }

  function timeAgo(iso) {
    const then = new Date(iso).getTime();
    const diffMin = Math.floor((Date.now() - then) / 60000);
    if (diffMin < 1) return 'updated just now';
    if (diffMin === 1) return 'updated 1 min ago';
    if (diffMin < 60) return `updated ${diffMin} min ago`;
    const hrs = Math.floor(diffMin / 60);
    return `updated ${hrs}h ${diffMin % 60}m ago`;
  }

  async function loadData() {
    try {
      const res = await fetch('data.json?_=' + Date.now());
      if (!res.ok) throw new Error('no data yet');
      const data = await res.json();

      document.getElementById('league-name').textContent = data.league_name || 'League Table';
      document.getElementById('updated-text').textContent = timeAgo(data.last_updated);

      const rows = data.players.map(p => `
        <tr>
          <td><span class="${rankBadgeClass(p.rank)}">${p.rank}</span></td>
          <td class="mv">${movementArrow(p.rank, p.last_rank)}</td>
          <td>
            <span class="team">${escapeHtml(p.team_name)}</span>
            <span class="manager">${escapeHtml(p.manager_name)}</span>
          </td>
          <td class="num pts-gw">${p.gw_points ?? '–'}</td>
          <td class="num pts-total">${p.total_points ?? '–'}</td>
        </tr>
      `).join('');

      document.getElementById('rows').innerHTML = rows;
      document.getElementById('board').style.display = 'table';
      document.getElementById('loading-msg').style.display = 'none';
    } catch (e) {
      document.getElementById('loading-msg').textContent =
        'No data yet — the first scheduled update may take up to 15 minutes after setup.';
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  loadData();
  setInterval(loadData, REFRESH_MS);
</script>
</body>
</html>
