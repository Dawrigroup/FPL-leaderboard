name: Update FPL Leaderboard

on:
  schedule:
    # Runs every 5 minutes. GitHub may delay this slightly under load.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you manually trigger a run from the Actions tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scraper
        run: python scraper.py

      - name: Check if journal image is needed
        id: check_gw
        run: python scripts/check_new_gw.py

      - name: Install Playwright
        if: steps.check_gw.outputs.need_generate == 'true'
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Generate journal image
        if: steps.check_gw.outputs.need_generate == 'true'
        run: python scripts/generate_journal_image.py

      - name: Update last image gw marker
        if: steps.check_gw.outputs.need_generate == 'true'
        run: echo "${{ steps.check_gw.outputs.current_gw }}" > last_image_gw.txt

      - name: Commit updated files
        run: |
          git config user.name "fpl-leaderboard-bot"
          git config user.email "actions@github.com"
          git add data.json
          [ -f journal.png ] && git add journal.png
          [ -f last_image_gw.txt ] && git add last_image_gw.txt
          git diff --staged --quiet || git commit -m "Update leaderboard data"
          git push
